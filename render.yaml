# Render: sito statico con la versione compilata (cartella dist/)
services:
  - type: web
    name: yatzy-duello
    runtime: static
    rootDir: dist
    buildCommand: echo "niente da compilare"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
